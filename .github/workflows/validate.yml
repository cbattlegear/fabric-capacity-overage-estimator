name: Validate module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@v5
      - name: Save development and runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cache = Join-Path $env:RUNNER_TEMP 'overage-development-modules'
          $null = New-Item -ItemType Directory -Path $cache -Force
          $dependencies = Import-PowerShellDataFile .\scripts\DevelopmentDependencies.psd1
          foreach ($name in $dependencies.Keys) {
            Save-PSResource -Name $name -Version $dependencies[$name] -Repository PSGallery -Path $cache -TrustRepository -Quiet
          }
          $manifest = Import-PowerShellDataFile .\FabricCapacityOverage\FabricCapacityOverage.psd1
          foreach ($dependency in $manifest.RequiredModules) {
            Save-PSResource -Name $dependency.ModuleName -Version $dependency.ModuleVersion -Repository PSGallery -Path $cache -TrustRepository -Quiet
          }
          "PSModulePath=$cache;$env:PSModulePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Manifest, import, help, full analyzer and offline Pester
        shell: ${{ matrix.shell }}
        run: |
          .\scripts\Test-Module.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'TestResults.xml')
      - name: Offline package and isolated package import
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          .\scripts\Test-Package.ps1 -DestinationPath (Join-Path $env:RUNNER_TEMP 'overage-packages')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: ${{ runner.temp }}\TestResults.xml
          if-no-files-found: error
