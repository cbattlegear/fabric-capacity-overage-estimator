name: Validate module

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Save development and runtime dependencies
        shell: pwsh
        run: |
          .\scripts\Restore-DevelopmentDependencies.ps1
      - name: Manifest, import, help, full analyzer and offline Pester on PowerShell 7
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          .\scripts\Test-Module.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'TestResults.xml')
      - name: Manifest, import, help, full analyzer and offline Pester on Windows PowerShell
        if: matrix.shell == 'powershell'
        shell: powershell
        run: |
          .\scripts\Test-Module.ps1 -ResultPath (Join-Path $env:RUNNER_TEMP 'TestResults.xml')
      - name: Offline package and isolated package import
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          .\scripts\Test-Package.ps1 -DestinationPath (Join-Path $env:RUNNER_TEMP 'overage-packages')
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ matrix.shell }}
          path: ${{ runner.temp }}\TestResults.xml
          if-no-files-found: error
